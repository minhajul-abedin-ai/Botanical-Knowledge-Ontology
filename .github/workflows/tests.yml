name: ontology-tests

on:
  push:
  pull_request:

# Build and test jobs only need to read repository contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rdflib-version: ['7.5.0', '7.6.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Install matrix RDFLib version
        run: python -m pip install "rdflib==${{ matrix.rdflib-version }}"
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Verify RDFLib version for fingerprint reproducibility
        run: python -c "import rdflib; assert rdflib.__version__ == '${{ matrix.rdflib-version }}', rdflib.__version__; print('RDFLib version:', rdflib.__version__)"
      - run: python src/build_ontology.py
      - run: python src/validate_ontology.py
      - run: pytest -q
